name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DP_DATA_ROOT: ${{ github.workspace }}/build/dp-data
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check out public data sources
        uses: actions/checkout@v7.0.1
        with:
          repository: soodoku/dp-data
          ref: 555b29d8dbd364c7f5048d3f32748fdb87e97bdb
          path: build/dp-data
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended biber
      - name: Check analysis and paper
        run: make check
      - name: Show estimate changes on failure
        if: failure()
        run: git diff -- tabs/main_estimates.csv tabs/directional_estimates.csv
